name: Appliance image

on:
  push:
    tags: ['v*']
    # Development builds while the milestone branch is open (workflow_dispatch
    # works only from the default branch); dropped at the merge.
    branches: ['m3-*']
    paths: ['image/**', 'deploy/**', '.github/workflows/image.yml']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the image and the binary
        default: 0.0.0-dev
        required: true

permissions:
  contents: write

jobs:
  image:
    name: Build the qcow2, the OpenSCAP report and the binary tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Version
        run: |
          v="${VERSION#v}"
          echo "VER=$v" >> "$GITHUB_ENV"
          echo "building portico $v"
      - name: Build the binary (linux/amd64, static)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o dist/portico ./cmd/portico
          tar -czf "dist/portico-$VER-linux-amd64.tar.gz" -C dist portico
          (cd dist && sha256sum "portico-$VER-linux-amd64.tar.gz" > "portico-$VER-linux-amd64.tar.gz.sha256")
          tar -czf "dist/install-$VER.tar.gz" deploy
          ls -la dist
      - name: QEMU and KVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm
      - uses: hashicorp/setup-packer@v3
        with:
          version: "1.11.2"
      - name: Packer build
        working-directory: image
        env:
          PACKER_LOG: "0"
        run: |
          packer init portico.pkr.hcl
          packer build -color=false -var "version=$VER" -var "binary=$PWD/../dist/portico" portico.pkr.hcl
          ls -la output
      - name: Collect
        run: |
          mkdir -p release
          cp "image/output/portico-$VER.qcow2" "image/output/portico-$VER.qcow2.sha256" "image/output/portico-$VER-oscap.html" release/
          cp dist/portico-"$VER"-linux-amd64.tar.gz dist/portico-"$VER"-linux-amd64.tar.gz.sha256 dist/install-"$VER".tar.gz release/
          # The checksum post-processor writes "<sum>  output/<name>": keep the bare file name.
          sed -i 's#  .*/#  #' "release/portico-$VER.qcow2.sha256"
          ls -la release; cat "release/portico-$VER.qcow2.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: portico-${{ env.VER }}
          path: release/
          retention-days: 14
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
