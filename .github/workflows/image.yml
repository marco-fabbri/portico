name: Appliance image

on:
  # A release is a tag; a manual run builds an image to try. Development
  # builds happen on a build host (lab/build-host, image/build.sh), not here:
  # the light checks of every pull request are in ci.yml.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the image and the binary
        default: 0.0.0-dev
        required: true

# Actions are pinned by commit (the tag is the comment). The build job
# reads only; the release job alone gets a token that writes.
permissions:
  contents: read

jobs:
  image:
    name: Build the qcow2, the OpenSCAP report and the binary tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # A tag names the version; a manual run gives it; a branch build is 0.0.0-dev.
      VERSION: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '0.0.0-dev' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Version
        run: |
          v="${VERSION#v}"
          echo "VER=$v" >> "$GITHUB_ENV"
          echo "building portico $v"
      - name: Release notes (tags only)
        # The release text is docs/releases/v<X.Y.Z>.md (a suffix such as
        # -rc.2 shares the notes of its release): refused here, not after
        # the image build.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          notes="docs/releases/v${VER%%-*}.md"
          [ -f "$notes" ] || { echo "::error::release notes $notes missing"; exit 1; }
          echo "release notes: $notes"
      - name: Build the binary (linux/amd64, static)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o dist/portico ./cmd/portico
          tar -czf "dist/portico-$VER-linux-amd64.tar.gz" -C dist portico
          (cd dist && sha256sum "portico-$VER-linux-amd64.tar.gz" > "portico-$VER-linux-amd64.tar.gz.sha256")
          tar -czf "dist/install-$VER.tar.gz" deploy
          ls -la dist
      - name: QEMU and KVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3
        with:
          version: "1.11.2"
      - name: Packer build (install, then provision)
        working-directory: image
        env:
          PACKER_LOG: "0"
          # The plugin getter asks the GitHub API; unauthenticated it is rate limited.
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ../image/build.sh "$VER" "$PWD/../dist/portico"
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: "1.8.5"
          # The action's wrapper does not pass stdin on: tofu console
          # waited for the expression until the timeout.
          tofu_wrapper: false
      - name: Boot test (KVM, config drive as AHV attaches it)
        run: |
          sudo apt-get install -y -q genisoimage openssh-client >/dev/null
          SEED_FORMAT=configdrive image/scripts/boottest.sh "image/output/portico-$VER.qcow2"
      - name: Boot test (KVM, NoCloud seed)
        run: SEED_FORMAT=nocloud image/scripts/boottest.sh "image/output/portico-$VER.qcow2"
      - name: Serial consoles
        if: always()
        run: |
          echo "== install stage"; tail -n 120 image/serial-install.log 2>/dev/null || echo "(no install log)"
          echo "== provision stage"; tail -n 60 image/serial-provision.log 2>/dev/null || echo "(no provision log)"
          for f in image/boottest-serial-*.log; do [ -e "$f" ] && { echo "== $f"; tail -n 80 "$f"; }; done; true
      - name: Collect
        run: |
          mkdir -p release
          cp "image/output/portico-$VER.qcow2" "image/output/portico-$VER.qcow2.sha256" "image/output/portico-$VER-oscap.html" release/
          cp dist/portico-"$VER"-linux-amd64.tar.gz dist/portico-"$VER"-linux-amd64.tar.gz.sha256 dist/install-"$VER".tar.gz release/
          # Packer's checksum file is tab-separated and lists the report too;
          # write the standard "<sum>  <name>" that sha256sum -c accepts.
          (cd release && sha256sum "portico-$VER.qcow2" > "portico-$VER.qcow2.sha256" && sha256sum "portico-$VER-oscap.html" > "portico-$VER-oscap.html.sha256" && sha256sum "install-$VER.tar.gz" > "install-$VER.tar.gz.sha256" && sha256sum -c ./*.sha256)
          ls -la release; cat "release/portico-$VER.qcow2.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portico-${{ env.VER }}
          path: release/
          retention-days: 14

  release:
    name: Publish the release (tags only)
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The release text comes from the tagged tree.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "NOTES=docs/releases/v${v%%-*}.md" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: portico-*
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && ls -la && sha256sum -c ./*.sha256
      # A draft: Marco reads it on GitHub and publishes it himself.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ env.NOTES }}
          files: release/*
