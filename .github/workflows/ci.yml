name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (format, vet, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then echo "not formatted:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...

  scripts:
    name: Lab scripts (shellcheck, offline checks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tool versions
        run: bash --version | head -1; shellcheck --version | head -2; jq --version
      - name: lab/test_scripts.sh
        run: lab/test_scripts.sh

  image:
    name: Image definition (packer validate, kickstart, tailoring)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3
        with:
          version: "1.11.2"
      - name: packer validate
        run: cd image && mkdir -p boot && touch boot/initrd.img && packer init portico.pkr.hcl && packer validate -var version=0.0.0 -var binary=/bin/true portico.pkr.hcl
      - name: kickstart
        run: pipx install pykickstart && ksvalidator -v RHEL9 image/portico.ks
      - name: tailoring is well-formed and names the profile
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('image/oscap/tailoring.xml')" && grep -q 'xccdf_org.ssgproject.content_profile_cis_server_l1' image/oscap/tailoring.xml

  tofu:
    name: OpenTofu deployer (fmt, validate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: "1.8.5"
      - run: cd deploy/tofu/nutanix && tofu fmt -check -recursive && tofu init -backend=false && tofu validate
