# nginx stand-in for the Portico proxy. Lab only, no auth filter yet.
# Two public host names on one listener:
#   id.lab.portico.test    -> Keycloak on 127.0.0.1:8080
#   prism.lab.portico.test -> Prism Central on https://10.23.210.175:9440
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;
events { worker_connections 1024; }

http {
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;
    # Never log credential values: only whether an Authorization header was present.
    map $http_authorization $auth_present {
        default present;
        ''      -;
    }
    log_format main '$remote_addr - $remote_user [$time_local] "$host" "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr auth=$auth_present';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ssl_certificate     /etc/portico-lab/tls/lab.crt;
    ssl_certificate_key /etc/portico-lab/tls/lab.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server {
        listen 443 ssl http2;
        server_name id.lab.portico.test;
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }
    }

    server {
        listen 443 ssl http2;
        server_name prism.lab.portico.test;
        location / {
            proxy_pass https://10.23.210.175:9440;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }

    server {
        listen 443 ssl http2 default_server;
        server_name _;
        return 444;
    }
}
