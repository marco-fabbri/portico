<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" role="img" aria-label="Portico Lab MSP">
  <!-- A portico: a roof, three arches on four columns, a base. Lab logo, inert SVG. -->
  <g fill="none" stroke="#8b1f5f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- roof -->
    <path d="M14 46 L60 12 L106 46"/>
    <path d="M14 46 H106"/>
    <!-- columns -->
    <path d="M22 54 V100 M46 54 V100 M74 54 V100 M98 54 V100"/>
    <!-- arches -->
    <path d="M22 70 a12 12 0 0 1 24 0 M46 70 a14 14 0 0 1 28 0 M74 70 a12 12 0 0 1 24 0"/>
    <!-- base -->
    <path d="M8 106 H112"/>
  </g>
  <g fill="#8b1f5f">
    <!-- column capitals -->
    <rect x="17" y="50" width="10" height="5" rx="1"/>
    <rect x="41" y="50" width="10" height="5" rx="1"/>
    <rect x="69" y="50" width="10" height="5" rx="1"/>
    <rect x="93" y="50" width="10" height="5" rx="1"/>
  </g>
  <text x="130" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="3" fill="#1d2b36">PORTICO</text>
  <text x="132" y="92" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" letter-spacing="4" fill="#8b1f5f">LAB MSP</text>
</svg>
