# Portico settings for the lab VM portico-lab (10.23.210.190). Lab only:
# tls_verify is off because Prism Central uses a self-signed certificate,
# and the internal listeners reuse the lab certificate. Secrets are files.
# Since Milestone 2d this file is read once by `portico settings import`
# (lab/portico/deploy.sh); the VM then runs from lab/portico/portico.store.yaml.
public:
  listen: ":443"
  tls:
    cert_file: /etc/portico/tls/lab.crt
    key_file: /etc/portico/tls/lab.key
  prism_host: prism.lab.portico.test
  id_host: id.lab.portico.test

internal:
  admin_listen: "10.23.210.190:8443"
  passthrough_listen: "10.23.210.190:9440"
  tls:
    cert_file: /etc/portico/tls/lab.crt
    key_file: /etc/portico/tls/lab.key

prism_central:
  url: https://10.23.210.175:9440
  tls_verify: false
  api_key_file: /etc/portico/prism-api-key
  saml_idp_name: portico-lab-keycloak

keycloak:
  url: http://127.0.0.1:8080
  realm: portico-lab
  admin_client_id: portico-admin
  admin_client_secret_file: /etc/portico/keycloak-admin-secret
  theme_dir: /var/lib/portico/keycloak-theme   # mounted as /opt/keycloak/themes/portico (lab/vm/keycloak.container)
  theme_name: portico

oidc:
  issuer: https://id.lab.portico.test/realms/portico-lab
  client_id: portico
  client_secret_file: /etc/portico/oidc-client-secret

session:
  max_age: 8h
  idle: 15m

log:
  level: debug

store:
  path: /var/lib/portico/portico.db
  master_key_file: /var/lib/portico/master.key

tenants:
  project_prefix: portico-lab   # lab safety: only portico-lab-* projects are ever touched
  group_prefix: tenant-
  role: Project Admin
  # NTNX-01 cluster and its container `objectsl889411dccd9a44125aa3e31c2596dcf9`
  # (docs/lab/payloads/resource-group-create.json; write-up 14 lists the names)
  cluster_ext_id: 00065dbb-5b39-35c7-78ee-5254000e0b96
  storage_container_ext_id: 206ecd5c-0ae4-44e7-bf94-dc7b0870f9e2
  operation_timeout: 15m        # the nested lab Prism Central is slow
