<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Portico</title>
<link rel="stylesheet" href="/static/portico.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">Portico</a>
  <nav>
    {{if .Admin}}
    <span class="who">{{.Admin}}</span>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      <button type="submit" class="link">Log out</button>
    </form>
    {{end}}
  </nav>
</header>
<main>
{{if .Error}}<div class="banner error">{{.Error}}</div>{{end}}
{{if .Notice}}<div class="banner notice">{{.Notice}}</div>{{end}}
{{template "content" .}}
</main>
<footer>Portico {{.Version}}</footer>
</body>
</html>
