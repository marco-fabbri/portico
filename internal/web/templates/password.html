{{define "content"}}
<section class="card narrow" style="margin-top:1rem">
  <h1>Admin password</h1>
  {{if .Data.Required}}<p class="muted">This appliance still has its factory password. Set your own before anything else: the API refuses the factory one, and this page is the only one open until it is changed.</p>{{end}}
  <form method="post" action="/password">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <label>Current password <input type="password" name="current" autocomplete="current-password" required autofocus></label>
    <label>New password (at least 12 characters) <input type="password" name="new_password" autocomplete="new-password" minlength="12" required></label>
    <label>New password again <input type="password" name="confirm" autocomplete="new-password" minlength="12" required></label>
    <div class="actions"><button type="submit" class="primary">Change the password</button></div>
  </form>
</section>
{{end}}
