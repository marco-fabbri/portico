<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · {{.B.MSPName}}</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1d2b36; background: #f4f6f8; }
  main { text-align: center; padding: 2rem; max-width: 520px; }
  img.logo { max-height: 96px; max-width: 320px; margin-bottom: 1rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { color: #5f6f7c; }
  a.button { display: inline-block; margin-top: 1rem; padding: .5rem 1rem; border-radius: 4px; background: {{.B.AccentColor}}; color: #fff; text-decoration: none; }
  .code { color: #9aa5ae; font-size: .85rem; margin-top: 2rem; }
</style>
</head>
<body>
<main>
  {{if .HasLogo}}<img class="logo" src="/.portico/logo" alt="{{.B.MSPName}}">{{else}}<h2>{{.B.MSPName}}</h2>{{end}}
  <h1>{{.Title}}</h1>
  <p>{{.Text}}</p>
  {{if .Retry}}<a class="button" href="{{.Retry}}">Try again</a>{{end}}
  <p class="code">{{.Status}}</p>
</main>
</body>
</html>
