<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · {{.B.MSPName}}</title>
<link rel="icon" href="/.portico/favicon.ico?v={{.IconVersion}}" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/.portico/apple-touch-icon.png?v={{.IconVersion}}">
<style>{{template "brand-css" .}}
  .card { background: #fff; color: #1d1d1b; border-radius: 14px; padding: 1.6rem 2rem; max-width: 440px; width: 100%; box-sizing: border-box; text-align: center; }
  .card h1 { font-size: 1.3rem; margin: 0 0 .5rem; }
  .card p { color: #6b6762; margin: .3rem 0; }
  .card .code { color: #8a867f; font-size: .85rem; margin-top: 1rem; }
  a.button { display: inline-block; margin-top: 1rem; padding: .55rem 1.1rem; border-radius: 8px; background: {{.B.AccentColor}}; color: #fff; text-decoration: none; font-weight: 600; }
  .status { text-align: center; }
  .status a { color: {{.B.TextColor}}; }
  .spinner { width: 36px; height: 36px; margin: 0 auto 1rem; border: 4px solid color-mix(in srgb, {{.B.TextColor}} 35%, transparent); border-top-color: {{.B.TextColor}}; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
{{template "brand-header" .}}
<section class="card">
  <h1>{{.Title}}</h1>
  <p>{{.Text}}</p>
  {{if .Retry}}<a class="button" href="{{.Retry}}">Try again</a>{{end}}
  <p class="code">{{.Status}}</p>
</section>
{{template "brand-powered" .}}
</body>
</html>
